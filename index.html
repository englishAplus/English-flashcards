<style>
:root{--bg:#edf2f7;--ink:#182433;--muted:#667085;--navy:#27415d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",Arial,sans-serif}
.app{max-width:760px;margin:auto;padding:14px}
header{text-align:center;margin:4px 0 12px}
h1{font-size:24px;margin:0 0 5px}
header p{margin:0;color:var(--muted);font-size:14px}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:12px}
button{border:0;border-radius:15px;padding:12px 8px;font-size:16px;font-weight:850;background:#fff;color:var(--ink);box-shadow:0 2px 10px #0001}
button.primary{background:var(--navy);color:#fff}
.card{background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 12px 34px #10182818;min-height:590px}
.top{padding:15px 18px;color:#fff;display:flex;align-items:center;justify-content:space-between}
.wordHead{font-size:30px;font-weight:950}
.meta{font-size:14px;font-weight:800;text-align:right}
.visual{width:100%;height:330px;object-fit:cover;display:block;background:#ddd}
.body{padding:17px 18px 20px}
.listen{color:#fff;box-shadow:none;margin-bottom:12px}
.prompt{font-size:16px;color:var(--muted);line-height:1.6}
.answer{font-size:60px;font-weight:950;margin:4px 0}
.ipa{font-size:23px;color:var(--muted);margin-bottom:10px}
.meaning{font-size:25px;font-weight:900}
.note{margin-top:16px;padding:14px 15px;border-radius:16px;background:#f5f7fa;line-height:1.65;font-size:16px}
.sentence{font-size:28px;font-weight:900;line-height:1.42}
.zh{font-size:20px;line-height:1.6;margin-top:14px}
.exam{margin-top:16px;background:#eef7f1;border-radius:16px;padding:14px 15px;font-size:16px;line-height:1.6}
.status{text-align:center;color:var(--muted);font-size:13px;margin:10px 0 0}
.voice{margin-top:12px;background:#fff;border-radius:18px;padding:13px 15px;font-size:14px;line-height:1.65;color:var(--muted)}
@media(max-width:520px){.card{min-height:540px}.visual{height:290px}.sentence{font-size:24px}.answer{font-size:52px}}
</style>

let index=0, back=false;
let voices=[];

function loadVoices(){ voices=speechSynthesis.getVoices(); }
loadVoices();
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged=loadVoices;

function bestVoice(){
 const preferred=['Ava','Samantha','Evan','Allison','Susan','Tom','Zoe','Joelle'];
 const en=voices.filter(v=>/^en-US/i.test(v.lang));
 for(const name of preferred){
   const hit=en.find(v=>v.name.toLowerCase().includes(name.toLowerCase()));
   if(hit) return hit;
 }
 return en[0] || voices.find(v=>/^en/i.test(v.lang)) || null;
}

function utter(text, rate=0.96, pitch=1.02){
 return new Promise(resolve=>{
   const u=new SpeechSynthesisUtterance(text);
   u.lang='en-US'; u.rate=rate; u.pitch=pitch;
   const v=bestVoice(); if(v) u.voice=v;
   u.onend=resolve; u.onerror=resolve;
   speechSynthesis.speak(u);
 });
}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}

async function speakWord(word){
 if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音朗讀。');return;}
 speechSynthesis.cancel();
 await wait(80);
 for(let n=0;n<3;n++){ await utter(word,0.92,1.03); if(n<2) await wait(550); }
 await wait(750);
 const spelling=word.toUpperCase().split('').join(', ');
 await utter(spelling,0.78,1.03);
}

async function speakSentence(text){
 if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音朗讀。');return;}
 speechSynthesis.cancel(); await wait(80); await utter(text,0.94,1.02);
}

function render(){
 const c=cards[index];
 const color=c.color;
 const label=c.stage===1?'單字概念卡':'例句情境卡';
 const front=c.stage===1
 ? `<button class="listen" style="background:${color}" onclick="speakWord('${c.word}')">🔊 聽發音 ×3 ＋拼字</button>
    <div class="prompt">先看圖、聽聲音，再想英文單字。不要急著翻面。</div>`
 : `<button class="listen" style="background:${color}" onclick='speakSentence(${JSON.stringify(c.sentenceSpeak)})'>🔊 聽完整例句</button>
    <div class="prompt">先看情境圖，再聽完整句子，試著抓出目標字與句意。</div>`;
 const backHtml=c.stage===1
 ? `<div class="answer">${c.word}</div><div class="ipa">${c.ipa}</div>
    <div class="meaning">${c.pos}｜${c.zh}</div>
    <div class="note"><b>圖像思考：</b>${c.conceptNote}</div>
    <button class="listen" style="background:${color};margin-top:16px" onclick="speakWord('${c.word}')">🔊 再聽 ×3 ＋拼字</button>`
 : `<div class="sentence">${highlight(c.sentence,c.word)}</div>
    <div class="zh">${c.trans}</div>
    <div class="exam"><b>會考 A 級重點：</b>${c.exam}</div>
    <button class="listen" style="background:${color};margin-top:16px" onclick='speakSentence(${JSON.stringify(c.sentenceSpeak)})'>🔊 再聽整句</button>`;
 document.getElementById('card').innerHTML=
 `<div class="top" style="background:${color}"><div class="wordHead">${c.word}</div><div class="meta">${Math.floor(index/2)+1} / 10<br>${label}</div></div>
  <img class="visual" src="data:image/jpeg;base64,${c.img}" alt="${c.word} illustration">
  <div class="body">${back?backHtml:front}</div>`;
 document.getElementById('flip').textContent=back?'看正面':'翻面';
 document.getElementById('status').textContent=`卡片 ${index+1} / ${cards.length} · ${back?'反面':'正面'}`;
}
function highlight(sentence,word){
 const re=new RegExp('\\b'+word+'\\b','gi');
 return sentence.replace(re, m=>`<span style="color:${cards[index].color}">${m}</span>`);
}
document.getElementById('next').onclick=()=>{speechSynthesis.cancel();index=(index+1)%cards.length;back=false;render();};
document.getElementById('prev').onclick=()=>{speechSynthesis.cancel();index=(index-1+cards.length)%cards.length;back=false;render();};
document.getElementById('flip').onclick=()=>{back=!back;render();};
render();
</script>
