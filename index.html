<script>const words=[{"word": "above", "ipa": "/əˈbʌv/", "pos": "介系詞", "zh": "在……上方；高於", "concept": "物體位於另一物體上方，兩者沒有接觸。", "sentence": "The temperature stayed above 30°C for several days, so many people chose to stay indoors during the hottest hours.", "speak": "The temperature stayed above thirty degrees Celsius for several days, so many people chose to stay indoors during the hottest hours.", "trans": "氣溫連續好幾天都維持在攝氏 30 度以上，因此許多人選擇在最炎熱的時段待在室內。", "exam": "above + 數字／標準＝高於、超過。", "svg": "<svg viewBox=\"0 0 800 600\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"800\" height=\"600\" fill=\"#e9f3f6\"/><rect x=\"150\" y=\"430\" width=\"500\" height=\"35\" rx=\"8\" fill=\"#8a6546\"/><path d=\"M400 40v120\" stroke=\"#334155\" stroke-width=\"10\"/><path d=\"M315 215Q400 115 485 215Z\" fill=\"#f4c95d\"/><ellipse cx=\"400\" cy=\"230\" rx=\"90\" ry=\"20\" fill=\"#ffe9a5\"/><path d=\"M400 275v110\" stroke=\"#1680a6\" stroke-width=\"8\" stroke-dasharray=\"12 12\"/><path d=\"M380 365l20 24 20-24\" fill=\"none\" stroke=\"#1680a6\" stroke-width=\"8\"/></svg>"}, {"word": "action", "ipa": "/ˈækʃən/", "pos": "名詞", "zh": "行動；動作", "concept": "看到問題後真正開始處理；take action 是重要搭配。", "sentence": "After seeing how much trash was left in the park, the students decided to take action and clean it up.", "speak": "After seeing how much trash was left in the park, the students decided to take action and clean it up.", "trans": "看到公園裡留下那麼多垃圾後，學生們決定採取行動，把它清理乾淨。", "exam": "take action＝採取行動；After + V-ing 表「在……之後」。", "svg": "<svg viewBox=\"0 0 800 600\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"800\" height=\"600\" fill=\"#edf6ef\"/><path d=\"M0 440Q200 380 400 440T800 440V600H0Z\" fill=\"#b9d9a8\"/><circle cx=\"400\" cy=\"175\" r=\"62\" fill=\"#e9b98f\"/><path d=\"M330 145q70-90 140 0\" fill=\"#253444\"/><path d=\"M335 245q65-35 130 0l55 190H280z\" fill=\"#607d8b\"/><path d=\"M345 290L245 420M455 290l85 130\" stroke=\"#e9b98f\" stroke-width=\"34\" stroke-linecap=\"round\"/><path d=\"M215 430l70-20 35 125-105 15z\" fill=\"#dfe8e6\"/><rect x=\"565\" y=\"455\" width=\"80\" height=\"32\" rx=\"8\" fill=\"#ef8354\"/></svg>"}, {"word": "again", "ipa": "/əˈɡen/", "pos": "副詞", "zh": "再次；又", "concept": "同一件事再做一次。", "sentence": "If you do not understand the question the first time, read it again and look for the key words.", "speak": "If you do not understand the question the first time, read it again and look for the key words.", "trans": "如果你第一次沒有看懂題目，就再讀一次並找出關鍵字。", "exam": "again 常與動作動詞搭配；if 引導條件句。", "svg": "<svg viewBox=\"0 0 800 600\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"800\" height=\"600\" fill=\"#fff3e7\"/><rect x=\"560\" y=\"150\" width=\"18\" height=\"300\" fill=\"#334155\"/><rect x=\"500\" y=\"170\" width=\"140\" height=\"95\" rx=\"10\" fill=\"none\" stroke=\"#334155\" stroke-width=\"12\"/><circle cx=\"310\" cy=\"335\" r=\"48\" fill=\"#e47d31\"/><path d=\"M175 420q80-180 190-95\" fill=\"none\" stroke=\"#e47d31\" stroke-width=\"9\" stroke-dasharray=\"14 12\"/><path d=\"M160 430l28-7-13-25\" fill=\"none\" stroke=\"#e47d31\" stroke-width=\"9\"/></svg>"}, {"word": "age", "ipa": "/eɪdʒ/", "pos": "名詞", "zh": "年齡", "concept": "用不同人生階段建立年齡概念。", "sentence": "Children under the age of twelve must be with an adult when they enter the museum.", "speak": "Children under the age of twelve must be with an adult when they enter the museum.", "trans": "十二歲以下的兒童進入博物館時必須有成人陪同。", "exam": "under the age of...＝未滿……歲；must 表必要性。", "svg": "<svg viewBox=\"0 0 800 600\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"800\" height=\"600\" fill=\"#f2ecf8\"/><circle cx=\"190\" cy=\"245\" r=\"62\" fill=\"#e8b58b\"/><circle cx=\"400\" cy=\"205\" r=\"72\" fill=\"#e8b58b\"/><circle cx=\"625\" cy=\"160\" r=\"80\" fill=\"#e8b58b\"/><path d=\"M115 480q75-170 150 0M310 500q90-210 180 0M520 520q105-250 210 0\" fill=\"#587a9d\"/></svg>"}, {"word": "almost", "ipa": "/ˈɔːlmoʊst/", "pos": "副詞", "zh": "幾乎；差不多", "concept": "非常接近完成，但還沒有完全達成。", "sentence": "We had almost reached the station when the heavy rain suddenly began.", "speak": "We had almost reached the station when the heavy rain suddenly began.", "trans": "我們幾乎要到車站時，突然下起了大雨。", "exam": "almost＝幾乎、差一點；when 連接兩個過去事件。", "svg": "<svg viewBox=\"0 0 800 600\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"800\" height=\"600\" fill=\"#f9eeee\"/><rect x=\"110\" y=\"155\" width=\"580\" height=\"22\" rx=\"8\" fill=\"#d1d5db\"/><rect x=\"575\" y=\"105\" width=\"10\" height=\"260\" fill=\"#d1d5db\"/><rect x=\"585\" y=\"105\" width=\"100\" height=\"55\" fill=\"#ef5350\"/><circle cx=\"475\" cy=\"350\" r=\"55\" fill=\"#e8b58b\"/><path d=\"M410 420q65-65 130 0l60 130H350z\" fill=\"#405d78\"/><path d=\"M600 450h-40\" stroke=\"#ef5350\" stroke-width=\"10\"/></svg>"}, {"word": "already", "ipa": "/ɔːlˈredi/", "pos": "副詞", "zh": "已經", "concept": "某件事在某個時間點之前就完成或發生。", "sentence": "By the time Kevin arrived at school, the first class had already started.", "speak": "By the time Kevin arrived at school, the first class had already started.", "trans": "Kevin 到學校時，第一堂課已經開始了。", "exam": "already 常與完成式搭配；by the time＝到……時。", "svg": "<svg viewBox=\"0 0 800 600\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"800\" height=\"600\" fill=\"#e9f5f5\"/><rect x=\"100\" y=\"80\" width=\"600\" height=\"430\" rx=\"16\" fill=\"#f8fafc\"/><circle cx=\"175\" cy=\"160\" r=\"55\" fill=\"#e7b68d\"/><path d=\"M120 245q55-65 110 0v170H120z\" fill=\"#587a9d\"/><circle cx=\"650\" cy=\"95\" r=\"58\" fill=\"#fff\"/><path d=\"M650 95V58M650 95l30 18\" stroke=\"#334155\" stroke-width=\"8\"/><circle cx=\"350\" cy=\"405\" r=\"35\" fill=\"#e7b68d\"/><circle cx=\"460\" cy=\"405\" r=\"35\" fill=\"#e7b68d\"/><circle cx=\"570\" cy=\"405\" r=\"35\" fill=\"#e7b68d\"/></svg>"}, {"word": "arm", "ipa": "/ɑːrm/", "pos": "名詞", "zh": "手臂", "concept": "肩膀到手腕之間的身體部位。", "sentence": "Jason could not finish the basketball game because he had hurt his arm during practice.", "speak": "Jason could not finish the basketball game because he had hurt his arm during practice.", "trans": "Jason 無法打完整場籃球賽，因為他練習時傷到了手臂。", "exam": "because 說明原因；hurt one's arm 是常見搭配。", "svg": "<svg viewBox=\"0 0 800 600\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"800\" height=\"600\" fill=\"#fff6df\"/><circle cx=\"400\" cy=\"165\" r=\"70\" fill=\"#e8b58b\"/><path d=\"M335 105q65-70 130 0\" fill=\"#293746\"/><path d=\"M315 260q85-70 170 0l55 235H260z\" fill=\"#597b94\"/><path d=\"M310 300L160 355M490 300l150 55\" stroke=\"#e8b58b\" stroke-width=\"42\" stroke-linecap=\"round\"/><path d=\"M160 355l120-35\" stroke=\"#e4a72d\" stroke-width=\"18\"/></svg>"}, {"word": "bag", "ipa": "/bæɡ/", "pos": "名詞", "zh": "包；袋", "concept": "用來裝或攜帶物品的容器。", "sentence": "I did not notice that I had left my bag on the bus until I got home.", "speak": "I did not notice that I had left my bag on the bus until I got home.", "trans": "直到回到家，我才注意到自己把包包忘在公車上。", "exam": "not...until...＝直到……才……。", "svg": "<svg viewBox=\"0 0 800 600\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"800\" height=\"600\" fill=\"#f8edf2\"/><rect x=\"70\" y=\"95\" width=\"660\" height=\"410\" rx=\"28\" fill=\"#d9e1e7\"/><rect x=\"225\" y=\"330\" width=\"310\" height=\"105\" rx=\"22\" fill=\"#667788\"/><path d=\"M335 365q45-90 90 0\" fill=\"none\" stroke=\"#374151\" stroke-width=\"20\"/><rect x=\"285\" y=\"350\" width=\"190\" height=\"130\" rx=\"18\" fill=\"#cf5f78\"/></svg>"}, {"word": "basket", "ipa": "/ˈbæskɪt/", "pos": "名詞", "zh": "籃子", "concept": "有開口、可盛裝或攜帶物品的籃狀容器。", "sentence": "Mia carried a basket of fresh vegetables home from the market for dinner.", "speak": "Mia carried a basket of fresh vegetables home from the market for dinner.", "trans": "Mia 從市場提了一籃新鮮蔬菜回家準備晚餐。", "exam": "a basket of + 名詞＝一籃……。", "svg": "<svg viewBox=\"0 0 800 600\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"800\" height=\"600\" fill=\"#eef1fb\"/><path d=\"M0 440h800v160H0z\" fill=\"#d7c39b\"/><path d=\"M250 205l55 280h190l55-280\" fill=\"#c69b63\"/><path d=\"M260 220h280M285 300h230M300 380h200\" stroke=\"#8c653d\" stroke-width=\"12\"/><circle cx=\"340\" cy=\"250\" r=\"45\" fill=\"#6da66a\"/><ellipse cx=\"445\" cy=\"265\" rx=\"55\" ry=\"35\" fill=\"#e77f45\"/></svg>"}, {"word": "below", "ipa": "/bɪˈloʊ/", "pos": "介系詞／副詞", "zh": "在……下方；低於", "concept": "位置、數字或程度低於參考點。", "sentence": "The temperature may fall below 10°C tonight, so remember to bring a warm jacket.", "speak": "The temperature may fall below ten degrees Celsius tonight, so remember to bring a warm jacket.", "trans": "今晚氣溫可能降到攝氏 10 度以下，所以記得帶一件保暖外套。", "exam": "below + 數字／標準＝低於；may 表可能性。", "svg": "<svg viewBox=\"0 0 800 600\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"800\" height=\"600\" fill=\"#eaf6ef\"/><rect x=\"315\" y=\"70\" width=\"170\" height=\"430\" rx=\"75\" fill=\"#fff\" stroke=\"#6b7c85\" stroke-width=\"10\"/><rect x=\"380\" y=\"120\" width=\"40\" height=\"310\" rx=\"20\" fill=\"#e7edf0\"/><rect x=\"380\" y=\"330\" width=\"40\" height=\"100\" rx=\"20\" fill=\"#4389c7\"/><circle cx=\"400\" cy=\"455\" r=\"55\" fill=\"#4389c7\"/><path d=\"M505 260h80M505 330h80\" stroke=\"#607d8b\" stroke-width=\"9\"/></svg>"}];let wi=0,stage=1,back=false,timer=null,voices=[];const sy=window.speechSynthesis;
function rv(){voices=sy?sy.getVoices():[]}if(sy){rv();sy.onvoiceschanged=rv}function bv(){let e=voices.filter(v=>/^en-US/i.test(v.lang));for(let n of ["Ava","Samantha","Allison","Evan","Tom"]){let v=e.find(x=>x.name.toLowerCase().includes(n.toLowerCase()));if(v)return v}return e[0]||voices.find(v=>/^en/i.test(v.lang))}
function say(t,r=.94){return new Promise(ok=>{if(!sy)return ok();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=r;u.pitch=1.02;let v=bv();if(v)u.voice=v;u.onend=ok;u.onerror=ok;sy.speak(u)})}const wait=m=>new Promise(r=>setTimeout(r,m));
async function wordAudio(){if(!sy)return;sy.cancel();await wait(100);let w=words[wi].word;for(let i=0;i<3;i++){await say(w,.92);if(i<2)await wait(600)}await wait(700);await say(w.toUpperCase().split("").join(", "),.76)}
async function sentenceAudio(){if(!sy)return;sy.cancel();await wait(100);await say(words[wi].speak,.94)}function play(){stage===1?wordAudio():sentenceAudio()}function auto(){clearTimeout(timer);if(sy)sy.cancel();timer=setTimeout(play,550)}
function hi(s,w){return s.replace(new RegExp("\\b"+w+"\\b","gi"),m=>'<span style="color:var(--accent)">'+m+'</span>')}
function render(ap=false){let w=words[wi],head=back?'<div class="headWord">'+w.word+'</div>':'<div></div>',sn=stage===1?'Stage 1 · 圖像概念':'Stage 2 · 會考情境',b;if(!back)b='<button class="listen" onclick="play()">🔊 發音</button><div class="prompt">'+(stage===1?'先看圖、聽聲音，想想這個英文單字。':'先看情境圖、聽完整例句，理解目標字在句中的用法。')+'</div>';else if(stage===1)b='<div class="answer">'+w.word+'</div><div class="ipa">'+w.ipa+'</div><div class="meaning">'+w.pos+'｜'+w.zh+'</div><div class="note"><b>圖像思考：</b>'+w.concept+'</div>';else b='<div class="sentence">'+hi(w.sentence,w.word)+'</div><div class="zh">'+w.trans+'</div><div class="exam"><b>會考 A 級：</b>'+w.exam+'</div>';document.getElementById("card").innerHTML='<div class="head">'+head+'<div class="stage">'+(wi+1)+' / 10<br>'+sn+'</div></div><div class="visual">'+w.svg+'</div><div class="content">'+b+'</div>';document.getElementById("flip").textContent=back?'看正面':'翻面';document.getElementById("status").textContent='第 '+(wi+1)+' 個單字 · '+(stage===1?'概念卡':'例句卡')+' · '+(back?'反面':'正面');if(ap&&!back)auto()}
function next(){if(sy)sy.cancel();if(stage===1)stage=2;else{stage=1;wi=(wi+1)%10}back=false;render(true)}function prev(){if(sy)sy.cancel();if(stage===2)stage=1;else{wi=(wi+9)%10;stage=2}back=false;render(true)}function flip(){if(sy)sy.cancel();back=!back;render(false)}window.addEventListener("load",()=>render(true));</script></body></html>
